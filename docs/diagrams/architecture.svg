<svg xmlns='http://www.w3.org/2000/svg' font-family='DejaVu Sans, Arial, sans-serif' viewBox='0 0 760 604' role='img' aria-label='The React client reaches MySQL only through the Express REST API' font-size='13'><defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6e7781'/></marker></defs><rect x='0' y='0' width='100%' height='100%' fill='#ffffff'/><text data-claude-text-id='title' x='24' y='30' font-size='15' font-weight='600' fill='#1f2328'>The React client reaches MySQL only through the Express REST API</text><text data-claude-text-id='subtitle' x='24' y='50' font-size='11.5' fill='#57606a'>Client-server architecture in three tiers</text><g data-claude-anchor='tier-client'><rect x='24' y='68' width='712' height='104' rx='8' fill='#f6f8fa' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='client-name' x='40' y='92' font-size='13' font-weight='600' fill='#1f2328'>Client tier: React single-page app in the browser</text><rect x='40' y='100' width='216' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='client-public-name' x='52' y='124' font-size='13' font-weight='600' fill='#1f2328'>Public pages</text><text data-claude-text-id='client-public-body' x='52' y='140' font-size='11.5' fill='#57606a'>Clinics, register, log in</text><rect x='272' y='100' width='216' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='client-patient-name' x='284' y='124' font-size='13' font-weight='600' fill='#1f2328'>Patient pages</text><text data-claude-text-id='client-patient-body' x='284' y='140' font-size='11.5' fill='#57606a'>New request, my requests</text><rect x='504' y='100' width='216' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='client-recep-name' x='516' y='124' font-size='13' font-weight='600' fill='#1f2328'>Receptionist pages</text><text data-claude-text-id='client-recep-body' x='516' y='140' font-size='11.5' fill='#57606a'>Requests dashboard, clinics</text></g><g data-claude-anchor='tier-server'><rect x='24' y='228' width='712' height='120' rx='8' fill='#f6f8fa' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='server-name' x='40' y='252' font-size='13' font-weight='600' fill='#1f2328'>Server tier: Node.js + Express REST API at /api/v1</text><rect x='40' y='260' width='152' height='72' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='server-routes-name' x='52' y='284' font-size='13' font-weight='600' fill='#1f2328'>Routes, guards</text><text data-claude-text-id='server-routes-b1' x='52' y='300' font-size='11.5' fill='#57606a'>JWT check, role check,</text><text data-claude-text-id='server-routes-b2' x='52' y='316' font-size='11.5' fill='#57606a'>input validation</text><rect x='216' y='260' width='152' height='72' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='server-ctrl-name' x='228' y='284' font-size='13' font-weight='600' fill='#1f2328'>Controllers</text><text data-claude-text-id='server-ctrl-b1' x='228' y='300' font-size='11.5' fill='#57606a'>Parse the request,</text><text data-claude-text-id='server-ctrl-b2' x='228' y='316' font-size='11.5' fill='#57606a'>send JSON response</text><rect x='392' y='260' width='152' height='72' rx='8' fill='#2f6feb' fill-opacity='0.12' stroke='#2f6feb' stroke-width='2'/><text data-claude-text-id='server-svc-name' x='404' y='284' font-size='13' font-weight='600' fill='#1f2328'>Services</text><text data-claude-text-id='server-svc-b1' x='404' y='300' font-size='11.5' fill='#57606a'>Business rules</text><text data-claude-text-id='server-svc-b2' x='404' y='316' font-size='11.5' fill='#57606a'>BR-01 to BR-13</text><rect x='568' y='260' width='152' height='72' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='server-models-name' x='580' y='284' font-size='13' font-weight='600' fill='#1f2328'>Models</text><text data-claude-text-id='server-models-b1' x='580' y='300' font-size='11.5' fill='#57606a'>SQL queries through</text><text data-claude-text-id='server-models-b2' x='580' y='316' font-size='11.5' fill='#57606a'>the mysql2 pool</text></g><g data-claude-anchor='server-flow'><path d='M192 296H216' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#arch-arrow)'/><path d='M368 296H392' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#arch-arrow)'/><path d='M544 296H568' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#arch-arrow)'/></g><g data-claude-anchor='tier-db'><rect x='24' y='404' width='712' height='176' rx='8' fill='#f6f8fa' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='db-name' x='40' y='428' font-size='13' font-weight='600' fill='#1f2328'>Database tier: MySQL 8</text><rect x='40' y='436' width='332' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='db-users-name' x='52' y='460' font-size='12' font-weight='600' fill='#1f2328'>users</text><text data-claude-text-id='db-users-body' x='52' y='476' font-size='11.5' fill='#57606a'>Patients and receptionists</text><rect x='388' y='436' width='332' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='db-clinics-name' x='400' y='460' font-size='12' font-weight='600' fill='#1f2328'>clinics</text><text data-claude-text-id='db-clinics-body' x='400' y='476' font-size='11.5' fill='#57606a'>Clinic name, location, status</text><rect x='40' y='508' width='332' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='db-hours-name' x='52' y='532' font-size='12' font-weight='600' fill='#1f2328'>clinic_working_hours</text><text data-claude-text-id='db-hours-body' x='52' y='548' font-size='11.5' fill='#57606a'>Working days and hours per clinic</text><rect x='388' y='508' width='332' height='56' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='db-req-name' x='400' y='532' font-size='12' font-weight='600' fill='#1f2328'>appointment_requests</text><text data-claude-text-id='db-req-body' x='400' y='548' font-size='11.5' fill='#57606a'>Requests, status and decisions</text></g><g data-claude-anchor='calls'><path d='M116 172V228' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#arch-arrow)' marker-start='url(#arch-arrow)'/><text data-claude-text-id='call-http-1' x='128' y='196' font-size='11.5' fill='#57606a'>HTTPS requests, JSON bodies</text><text data-claude-text-id='call-http-2' x='128' y='212' font-size='11.5' fill='#57606a'>Authorization: Bearer JWT</text><path d='M644 348V404' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#arch-arrow)' marker-start='url(#arch-arrow)'/><text data-claude-text-id='call-sql' x='632' y='380' text-anchor='end' font-size='11.5' fill='#57606a'>Parameterized SQL</text></g></svg>