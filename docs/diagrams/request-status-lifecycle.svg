<svg xmlns='http://www.w3.org/2000/svg' font-family='DejaVu Sans, Arial, sans-serif' viewBox='0 0 760 370' role='img' aria-label='A request starts Pending; only the receptionist confirms or rejects it' font-size='13'><defs><marker id='status-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6e7781'/></marker></defs><rect x='0' y='0' width='100%' height='100%' fill='#ffffff'/><text data-claude-text-id='title' x='24' y='30' font-size='15' font-weight='600' fill='#1f2328'>A request starts Pending; only the receptionist confirms or rejects it</text><text data-claude-text-id='subtitle' x='24' y='50' font-size='11.5' fill='#57606a'>Appointment request status lifecycle (BR-04, BR-10, BR-12)</text><g data-claude-anchor='connectors'><path d='M51 220H140' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#status-arrow)'/><path d='M210 200V120H490' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#status-arrow)'/><path d='M210 240V320H490' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#status-arrow)'/><path d='M280 220H490' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#status-arrow)'/><path d='M560 140V200' fill='none' stroke='#6e7781' stroke-width='1.25' marker-end='url(#status-arrow)'/></g><g data-claude-anchor='start'><circle cx='44' cy='220' r='7' fill='#1f2328'/></g><g data-claude-anchor='state-pending'><rect x='140' y='200' width='140' height='40' rx='8' fill='#bf8700' fill-opacity='0.12' stroke='#bf8700' stroke-width='2'/><text data-claude-text-id='pending' x='210' y='224' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Pending</text></g><g data-claude-anchor='state-confirmed'><rect x='490' y='100' width='140' height='40' rx='8' fill='#1a7f37' fill-opacity='0.12' stroke='#1a7f37' stroke-width='2'/><text data-claude-text-id='confirmed' x='560' y='124' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Confirmed</text></g><g data-claude-anchor='state-cancelled'><rect x='490' y='200' width='140' height='40' rx='8' fill='none' stroke='#6e7781' stroke-width='1.25'/><text data-claude-text-id='cancelled' x='560' y='224' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Cancelled</text></g><g data-claude-anchor='state-rejected'><rect x='490' y='300' width='140' height='40' rx='8' fill='#cf222e' fill-opacity='0.12' stroke='#cf222e' stroke-width='2'/><text data-claude-text-id='rejected' x='560' y='324' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Rejected</text></g><text data-claude-text-id='lbl-submitted' x='96' y='210' text-anchor='middle' font-size='11.5' fill='#57606a'>submitted</text><text data-claude-text-id='lbl-confirm' x='350' y='110' text-anchor='middle' font-size='11.5' fill='#57606a'>Receptionist confirms and sets a time</text><text data-claude-text-id='lbl-reject' x='350' y='310' text-anchor='middle' font-size='11.5' fill='#57606a'>Receptionist rejects with a reason</text><text data-claude-text-id='lbl-cancel' x='385' y='210' text-anchor='middle' font-size='11.5' fill='#57606a'>Patient cancels</text><text data-claude-text-id='lbl-cancel-confirmed-1' x='572' y='166' font-size='11.5' fill='#57606a'>Patient cancels</text><text data-claude-text-id='lbl-cancel-confirmed-2' x='572' y='182' font-size='11.5' fill='#57606a'>before the date</text><text data-claude-text-id='final-cancelled' x='642' y='224' font-size='11.5' fill='#57606a'>final status</text><text data-claude-text-id='final-rejected' x='642' y='324' font-size='11.5' fill='#57606a'>final status</text></svg>